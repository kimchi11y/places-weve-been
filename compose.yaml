# The site on your own server, for people on your Tailscale network. Settings go in .env (see .env.example).
name: places-weve-been

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-trips}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true" # the key is only needed the first time
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Keep this "false". Otherwise people on your network could reach the site without going
      # through Serve, and say they're someone else.
      TS_USERSPACE: "false"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  site:
    build: .
    image: places-weve-been
    # Shares Tailscale's network and listens only inside it. Never add `ports:` here or above.
    network_mode: service:tailscale
    environment:
      AUTH: tailscale
      EDITORS: ${EDITORS:-}
      HOST: 127.0.0.1
      PORT: "4321"
    volumes:
      - data:/data
    depends_on:
      tailscale:
        condition: service_started
        restart: true # a new Tailscale container means a new network to join
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  # Run by docker/backup.sh and docker/restore.sh, not by `docker compose up`
  backup: &tool
    image: places-weve-been
    profiles: [tools]
    command: ["node", "dist-node/tools/backup.mjs"]
    network_mode: none
    environment:
      BACKUP_DIR: /backups
    volumes:
      - data:/data:ro
      - ./backups:/backups
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  restore:
    <<: *tool
    command: ["node", "dist-node/tools/restore.mjs"]
    volumes:
      - data:/data
      - ./backups:/backups:ro

volumes:
  # Your trips and photos. `docker compose down -v` deletes them for good.
  data:
  tailscale:
